server {
    listen 80;
    server_name _;

    # 上传的制度文件可能有几十 MB
    client_max_body_size 64m;

    # 安全响应头。这是个给审计人员看的系统，页面被别的站点 iframe 进去
    # 做点击劫持是真实风险，而这几行的代价是零。
    add_header X-Frame-Options            "DENY"                        always;
    add_header X-Content-Type-Options     "nosniff"                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # 应用自带全部资源，不从任何 CDN 取东西，所以 default-src 'self' 就够。
    #
    # img-src 必须放 blob:——图谱导出 PNG 时把 SVG 序列化成 Blob、用
    # createObjectURL 喂给 <img> 再画进 canvas（见 graph/export.ts）。
    # 第一版漏了它，拿 86 条 e2e 打生产栈才发现：同样 3 条在开发栈（无 CSP）
    # 全过、在生产栈全挂。**CSP 是会悄悄打瘫功能的那类改动，必须实跑验证。**
    #
    # style-src 留 'unsafe-inline'：构建产物里有内联样式块。
    # frame-ancestors 与上面的 X-Frame-Options 同义，留着是为了老浏览器。
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 前后端同源，所以不需要 CORS——api 容器不对外暴露端口。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 抽取、映射这类任务是后台跑的，但导出准备包是同步的，给足时间
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # 单页应用：刷新子路由不能 404
    }
}
